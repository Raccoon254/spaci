name: Test

on:
  pull_request:
  push:
    branches:
      - main
      - v2-redesign
      - 'codex/**'
      - 'fix/**'
    # Release tags too: the release workflow builds and publishes straight to
    # users, so the tests have to run on exactly what ships.
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # Aligned with release.yml: the committed lockfile, exactly.
        run: npm install --no-audit --no-fund  # see release.yml: npm ci fails on the runners

      - name: Syntax check
        # bash on every runner (Git Bash on Windows) so the loop below is
        # portable; the default shell there is PowerShell.
        shell: bash
        run: |
          for f in src/*.js src/renderer/*.js src/renderer/screens/*.js; do
            node --check "$f"
          done

      - name: Unit tests
        run: npm test

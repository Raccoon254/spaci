name: Release

# Cutting a release: add an entry to the top of changelog.json, then run
# `make release` (or `npm run release`). That pushes a v<version> tag, which
# triggers this workflow to build, publish binaries, and sync the website.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned: electron-builder 24's temporary keychain step fails on the
          # macos-26 image from 26.6 on ("SecKeychainUnlock: The user name or
          # passphrase you entered is not correct"). Signing is gated on
          # `platform`, never on the runner label, so a label change can never
          # silently skip signing and notarization.
          - os: macos-15
            platform: mac
            args: '--mac --x64 --arm64'
          - os: windows-latest
            platform: win
            args: '--win'
          - os: ubuntu-latest
            platform: linux
            # Two passes: built together, deb and AppImage share one unpacked
            # dir, and the deb's resources/package-type could leak into the
            # AppImage and make it update itself with a .deb.
            args: '--linux AppImage'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # npm install, not npm ci: the lockfile is resolved on one OS and lacks
        # electron-builder's optional per-platform packages (for example
        # electron-builder-squirrel-windows and archiver), so npm ci fails the
        # strict lock check on the runners. v2.3.0-rc.1 failed exactly so.
        run: npm install --no-audit --no-fund

      # macOS: build + code-sign + notarize. The signing env (CSC_LINK etc.) is
      # ONLY set here; passing an empty CSC_LINK to Windows/Linux makes
      # electron-builder treat it as a bad cert path, so they get their own step.
      - name: Build and package (macOS, signed + notarized)
        if: matrix.platform == 'mac'
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CERTS }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build and package (Windows / Linux)
        if: matrix.platform != 'mac'
        shell: bash   # the Linux deb pass below is bash; Windows defaults to PowerShell
        run: |
          npx electron-builder ${{ matrix.args }} --publish never
          if [ "${{ matrix.platform }}" = linux ]; then
            # The deb pass rewrites latest-linux.yml with only the .deb, which
            # would hide the AppImage from its auto-updater. Keep the AppImage one.
            cp release/latest-linux.yml "$RUNNER_TEMP/latest-linux.yml"
            npx electron-builder --linux deb --publish never
            cp "$RUNNER_TEMP/latest-linux.yml" release/latest-linux.yml
            grep -q 'AppImage' release/latest-linux.yml || { echo "latest-linux.yml lost the AppImage"; exit 1; }
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # electron-updater has no feed for a .deb, so describe it in the same
      # shape for the website sync and the release notes.
      - name: Describe the deb for the website
        if: matrix.platform == 'linux'
        run: |
          node -e '
          const fs = require("fs"), crypto = require("crypto"), path = require("path");
          const deb = fs.readdirSync("release").find((f) => f.endsWith(".deb"));
          if (!deb) { console.error("no .deb was built"); process.exit(1); }
          const buf = fs.readFileSync(path.join("release", deb));
          const sha512 = crypto.createHash("sha512").update(buf).digest("base64");
          const version = require("./package.json").version;
          fs.writeFileSync("release/deb-linux.yml", `version: ${version}\nfiles:\n  - url: ${deb}\n    sha512: ${sha512}\n    size: ${buf.length}\n`);
          console.log(fs.readFileSync("release/deb-linux.yml", "utf8"));'

      # A tag with a suffix (v2.2.0-rc.1) is a release candidate: it becomes a
      # GitHub prerelease for testing and is never synced to the update feed.
      - name: Publish installers to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml
          fail_on_unmatched_files: false

      - name: Stash update feed for the sync job
        uses: actions/upload-artifact@v4
        with:
          name: feed-${{ matrix.os }}
          path: |
            release/latest*.yml
            release/deb-linux.yml
          if-no-files-found: ignore

  sync-feed:
    name: Sync release to the website
    needs: build
    # Release candidates never reach the website or anyone's auto-updater.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Collect feed files
        uses: actions/download-artifact@v4
        with:
          path: feed-artifacts

      - name: Flatten feed files
        run: |
          mkdir -p feed
          find feed-artifacts \( -name 'latest*.yml' -o -name 'deb-linux.yml' \) -exec cp {} feed/ \;
          ls -la feed

      - name: Publish release metadata to spaci.kentom.co.ke
        run: node scripts/sync-feed.mjs
        env:
          SITE: https://spaci.kentom.co.ke
          RELEASE_PUBLISH_SECRET: ${{ secrets.RELEASE_PUBLISH_SECRET }}
          FEED_DIR: feed

      # Written here, not in the build matrix: this job runs once, so there is
      # no race between three runners setting the same body, and the feed files
      # from every platform are already collected, which is where the real file
      # names, sizes and sha512 values come from.
      - name: Write the GitHub Release description
        run: |
          node scripts/release-notes.mjs --feed-dir feed > release-notes.md
          cat release-notes.md
          gh release edit "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Spaci ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:;"
    />
    <title>Spaci</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      html,
      body {
        background: transparent;
        margin: 0;
        overflow: hidden;
      }
      /* Hero accent wash on the reclaimable card. Strong on dark, subtle on
         light so the blue does not look heavy or muddy over the warm panel. */
      #tray {
        --hero-wash: rgba(1, 75, 170, 0.2);
      }
      #tray.light {
        --hero-wash: rgba(1, 75, 170, 0.08);
      }
    </style>
  </head>
  <body>
    <div class="sp-root" id="tray" style="position: static; inset: auto; height: 100vh; background: transparent; display: block; padding: 12px"></div>

    <script src="spaci-logo.js"></script>
    <script src="icon-component.js"></script>
    <script src="tray.js"></script>
  </body>
</html>
